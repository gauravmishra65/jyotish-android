<?xml version="1.0" encoding="UTF-8"?>
<!-- The Gaurav Jyotish mark, the same one the Android app carries: a North Indian kundali in gold on a
     night-sky indigo, Surya at the centre with the nine grahas around it. Ported from the adaptive icon's
     vector drawables (ic_launcher_background.xml and ic_launcher_foreground.xml), same 108x108 viewport
     and the same path data, so the two platforms show one mark rather than two that nearly match.
     make_icon.py renders this to app.ico. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <radialGradient id="sky" cx="54" cy="48" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36207A"/><stop offset="1" stop-color="#0E0A2E"/>
    </radialGradient>
    <radialGradient id="glow" cx="54" cy="54" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B347" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F6B347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="34" y1="34" x2="74" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7A8"/><stop offset="0.5" stop-color="#F6B347"/>
      <stop offset="1" stop-color="#E07B1F"/>
    </linearGradient>
    <clipPath id="rounded"><rect x="0" y="0" width="108" height="108" rx="24" ry="24"/></clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect x="0" y="0" width="108" height="108" fill="url(#sky)"/>
