name: windows-app

# Builds the thing a person actually installs: GauravJyotish.exe in a folder, and an installer around it.
#
# This has to run on Windows - PyInstaller freezes for the platform it runs on, and Inno Setup is a
# Windows compiler. Both are already on the windows-latest image, so there is nothing to install but the
# app's own dependencies.
#
# The result is unsigned. SmartScreen will warn the first time anyone runs it, and that warning is
# correct: buying a code-signing certificate is the only thing that removes it.

on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']

permissions:
  contents: read

jobs:
  build:
    name: Build the app and its installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install what the app needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: pyswisseph==2.10.3.2 tzdata cryptography
          python -m pip install pywebview==5.3.2 pyinstaller==6.11.1

      - name: The tests have to pass before anything is packaged
        run: python -m unittest discover -s windows/tests -v

      - name: Freeze the app
        run: pyinstaller --noconfirm --clean windows/packaging/jyotish.spec

      - name: The frozen app holds what it needs
        # A build that is missing the engine, the ephemeris, the places or the interface still produces
        # an .exe; it only fails when somebody runs it. Check here instead.
        shell: pwsh
        run: |
          $app = "dist/GauravJyotish"
          foreach ($need in @("GauravJyotish.exe", "_internal/engine/engine_api.py",
                              "_internal/engine/ephe/sepl_18.se1", "_internal/web/index.html",
                              "_internal/places.tsv")) {
            if (-not (Test-Path "$app/$need")) { throw "the build is missing $need" }
          }
          "{0:N1} MB" -f ((Get-ChildItem $app -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Build the installer
        shell: pwsh
        working-directory: windows/packaging
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss /O"${{ github.workspace }}\dist"

      - uses: actions/upload-artifact@v4
        with:
          name: GauravJyotish-windows
          path: |
            dist/GauravJyotish-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: GauravJyotish-windows-folder
          path: dist/GauravJyotish
          if-no-files-found: error
