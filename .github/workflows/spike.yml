name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to publish logs and screenshots to the ci-results branch

jobs:
  wheels:
    name: Build pyswisseph for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM for the test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reuse wheels built earlier for the same pyswisseph and cibuildwheel versions
        id: cache
        uses: actions/cache@v4
        with:
          path: wheelhouse
          key: pyswisseph-2.10.3.2-cibw-4.3.1-cp313-android-v1
      - name: Fetch the pyswisseph source and use its bundled libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install cibuildwheel==4.3.1
          pip download --no-binary :all: --no-deps pyswisseph==2.10.3.2 -d sdist
          tar xzf sdist/pyswisseph-2.10.3.2.tar.gz -C sdist
          # Do not let setup.py find the build machine's libswe or sqlite3 through pkg-config:
          # Android has neither, so the bundled sources must be compiled in.
          sed -i 's/^swe_detection = True/swe_detection = False/; s/^sqlite3_detection = True/sqlite3_detection = False/' sdist/pyswisseph-2.10.3.2/setup.py
          grep -n "_detection = " sdist/pyswisseph-2.10.3.2/setup.py
      - name: Build wheels (arm64 for phones, x86_64 for the emulator)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cibuildwheel --platform android sdist/pyswisseph-2.10.3.2 --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: "arm64_v8a x86_64"
          CIBW_BUILD_FRONTEND: build
          CIBW_TEST_COMMAND: >-
            python -c "import swisseph as s; jd = s.julday(2000, 1, 1, 12.0); assert abs(jd - 2451545.0) < 1e-9;
            sun = s.calc_ut(jd, s.SUN)[0][0]; assert abs(sun - 280.37) < 0.05, sun; print('swisseph', s.version, 'Sun', sun)"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

  app:
    name: Build the app and test it on an emulator
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy's build step runs pip with the same Python version as the app
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheels
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Verify the Python layer (ephemeris cross-check, forecast and report rules)
        run: |
          python3 -m pip install --quiet pyswisseph==2.10.3.2 tzdata
          python3 tools/verify/run_all.py 2>&1 | tee verify.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error title=Python verification::$(grep -E 'ISSUE|problems|FAILED' verify.log | tr '\n' ' ')"; exit 1; }
      - name: Check string resources
        run: python3 tools/check_strings.py | tee strings.log || { echo "::error title=Strings::$(cat strings.log | tr '\n' ' ')"; exit 1; }
      - name: Build debug APK and test APK
        run: |
          set -o pipefail
          gradle :app:testFullDebugUnitTest :app:assembleFullDebug :app:assembleFullDebugAndroidTest :app:assembleDemoDebug :app:assembleDemoDebugAndroidTest :app:assembleDemoRelease :app:assembleFullRelease :app:assemblePlayRelease :app:bundlePlayRelease --stacktrace 2>&1 | tee build.log || {
            # Turn the error section into annotations so it can be read through the API.
            python3 tools/ci_annotate.py build.log
            exit 1
          }
      - name: Size report
        run: |
          APK=app/build/outputs/apk/full/debug/app-full-debug.apk
          {
            echo "## APK size"
            echo
            echo "Whole debug APK (both ABIs): $(du -h $APK | cut -f1)"
            echo
            echo '```'
            unzip -l $APK | awk 'NR>3 && $4 != "" {split($4, p, "/"); k = p[1] "/" p[2]; s[k] += $1} END {for (k in s) printf "%8.1f MB  %s\n", s[k]/1048576, k}' | sort -rn | head -15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK size::$(du -h $APK | cut -f1) total; $(unzip -l $APK | awk 'NR>3 && $4 != "" {split($4, p, "/"); k = p[1] "/" p[2]; s[k] += $1} END {for (k in s) printf "%.1f MB %s; ", s[k]/1048576, k}')"
      - name: Release size
        run: |
          REL=app/build/outputs/apk/full/release/app-full-release.apk
          AAB=app/build/outputs/bundle/playRelease/app-play-release.aab
          {
            echo "## Release build (R8, shrunk resources)"
            echo
            echo "APK, both ABIs: $(du -h $REL | cut -f1). App Bundle: $(du -h $AAB | cut -f1). A phone downloads one ABI from Play, roughly half the APK."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release size::APK $(du -h $REL | cut -f1), AAB $(du -h $AAB | cut -f1)"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-apk
          path: app/build/outputs/apk/demo/release/app-demo-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: full-apk
          path: app/build/outputs/apk/full/release/app-full-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: play-store
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            app/build/outputs/apk/play/release/app-play-release.apk
            app/build/outputs/mapping/playRelease/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/full/debug/app-full-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the spike test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/ci_emulator.sh
      - name: Spike results
        if: always()
        run: |
          {
            echo "## Spike results (emulator)"
            echo
            echo '```'
            sed 's/^.*SPIKE *: //' spike.log 2>/dev/null || echo "no SPIKE log"
            echo '```'
            echo
            echo "## Cold start"
            echo '```'
            grep -E "TotalTime|WaitTime|Status" coldstart.log 2>/dev/null || echo "not measured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-logs
          path: |
            spike.log
            coldstart.log
            connected.log
            app/build/outputs/androidTest-results
      - name: Publish logs and screenshots to the ci-results branch
        if: always()
        run: |
          mkdir -p out
          cp -r shots out/ 2>/dev/null || true
          cp build.log connected.log spike.log coldstart.log release.log strings.log verify.log errors.log out/ 2>/dev/null || true
          mkdir -p out/test-results && cp -r app/build/test-results/* app/build/outputs/androidTest-results/* out/test-results/ 2>/dev/null || true
          echo "${GITHUB_SHA} run ${GITHUB_RUN_ID} $(date -u +%FT%TZ)" > out/RUN.txt
          cd out
          git init -q -b ci-results
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "CI results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/ci-results
