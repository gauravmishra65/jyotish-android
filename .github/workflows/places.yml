# Builds the offline village database from the full GeoNames files and commits it (run by hand when needed).
name: places
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  villages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download GeoNames (CC BY 4.0)
        run: |
          mkdir -p geo && cd geo
          for c in IN NP; do curl -fsSLO "https://download.geonames.org/export/dump/$c.zip" && unzip -oq $c.zip $c.txt; done
          curl -fsSLO https://download.geonames.org/export/dump/admin1CodesASCII.txt
          curl -fsSLO https://download.geonames.org/export/dump/admin2Codes.txt
          wc -l IN.txt NP.txt
      - name: Build villages.db.gz
        run: |
          pip install --quiet geonamescache==3.0.2
          python tools/make_villages.py geo | tee villages.log
          echo "::notice title=Villages::$(cat villages.log)"
      - name: Commit
        run: |
          git config user.name "Gaurav Mishra"
          git config user.email "gaurav.mishra65@gmail.com"
          git add app/src/main/assets/villages.db.gz
          git diff --cached --quiet || git commit -m "Village database from GeoNames (CC BY 4.0)" -m "Built by .github/workflows/places.yml"
          git push
